name: Security Scan

on:
  schedule:
    - cron: "0 6 * * *"  # Daily at 06:00 UTC
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          python -m pip install ".[all]"
          python -m pip uninstall -y forgeai

      - name: Validate dependency graph
        run: python -m pip check

      - name: Run pip-audit
        # vLLM 0.29.0 currently requires setuptools<81, while
        # PYSEC-2026-3447 is fixed in setuptools 83.0.0. The advisory affects
        # MANIFEST.in matching when building source distributions on macOS,
        # not ForgeAI runtime execution. ForgeAI's isolated build backend is
        # separately pinned to patched setuptools>=83. Remove this exception
        # once vLLM permits setuptools>=83 at runtime.
        run: pip-audit --strict --desc --ignore-vuln PYSEC-2026-3447

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
