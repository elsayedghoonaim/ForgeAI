name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Keep CI blocking on syntax/undefined-name correctness while the
      # repository's existing style/modernization Ruff debt is cleaned up.
      - name: Lint critical correctness
        run: python -m ruff check src tests --select E9,F63,F7,F82

      - name: Run tests
        run: python -m pytest tests -v --tb=short

      - name: Residue guard checks
        run: |
          echo "Checking packaging and configuration for legacy llama.cpp/GGUF residue..."
          if grep -iE 'llama-cpp-python|llamacpp|gguf_finder' pyproject.toml Dockerfile; then
            echo "ERROR: Legacy backend artifact residue found in package/docker configuration!"
            exit 1
          fi
          echo "Checking src/ for forbidden runtime import or class residue..."
          if grep -rnE 'import llama_cpp|from llama_cpp|class LlamaCppBackend' src/; then
            echo "ERROR: Legacy backend artifact residue found in src!"
            exit 1
          fi
          echo "Residue guard checks passed successfully."
