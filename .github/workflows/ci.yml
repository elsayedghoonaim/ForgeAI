name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Type check
        run: python -m mypy src/forgeai

      - name: Run tests
        run: python -m pytest tests -v --tb=short

      - name: Residue guard checks
        run: |
          echo "Checking packaging and configuration for legacy llama.cpp/GGUF residue..."
          if grep -iE 'llama-cpp-python|llamacpp|gguf_finder' pyproject.toml Dockerfile; then
            echo "ERROR: Legacy backend artifact residue found in package/docker configuration!"
            exit 1
          fi
          echo "Checking src/ for forbidden runtime import or class residue..."
          if grep -rnE 'import llama_cpp|from llama_cpp|class LlamaCppBackend' src/; then
            echo "ERROR: Legacy backend artifact residue found in src!"
            exit 1
          fi
          echo "Residue guard checks passed successfully."
