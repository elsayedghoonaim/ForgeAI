apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgeai
  labels:
    app: forgeai
    version: "2.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgeai
  template:
    metadata:
      labels:
        app: forgeai
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "11434"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forgeai
          image: forgeai:2.0.0
          command: ["forgeai", "serve"]
          args: ["--host", "0.0.0.0", "--port", "11434"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 11434
              name: http
              protocol: TCP
          env:
            - name: FORGEAI_MODEL_NAME
              value: "Qwen/Qwen2.5-7B-Instruct"
            - name: FORGEAI_TELEMETRY_ENABLED
              value: "false"
            - name: HOME
              value: "/data"
            - name: HF_HOME
              value: "/data/huggingface"
            - name: FORGEAI_HOME
              value: "/data/forgeai"
            - name: XDG_CACHE_HOME
              value: "/data/.cache"
            - name: TMPDIR
              value: "/tmp"
            - name: FORGEAI_AUTH_ENABLED
              value: "true"
            # Create with:
            #   kubectl create secret generic forgeai-auth \
            #     --from-literal=secret-key="$(openssl rand -hex 32)" \
            #     --from-literal=bootstrap-api-key="$(openssl rand -hex 24)"
            - name: FORGEAI_AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: forgeai-auth
                  key: secret-key
            - name: FORGEAI_BOOTSTRAP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: forgeai-auth
                  key: bootstrap-api-key
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: "32Gi"
              nvidia.com/gpu: "1"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: forgeai-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: tmp
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: forgeai-data
          persistentVolumeClaim:
            claimName: forgeai-data-pvc
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: forgeai
  labels:
    app: forgeai
spec:
  type: ClusterIP
  ports:
    - port: 11434
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: forgeai
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgeai-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
