[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeai"
version = "2.0.0"
description = "High-performance vLLM-powered local model runtime and server with Ollama and OpenAI API compatibility."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12,<3.13"
authors = [
    {name = "ForgeAI Team"},
]
keywords = ["vllm", "llm", "inference", "cli", "devtool", "gpu", "turboquant", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.9.0,<0.28",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "typing-extensions>=4.8.0,<5.0.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "huggingface-hub>=0.23.0",
    "pyjwt>=2.8.0",
    "psutil>=5.9.0",
    "safetensors>=0.4.0",
    "packaging",
    "jinja2",
]

[project.optional-dependencies]
# Note: The base development install without vLLM is provided only for management and unit-test workflows.
# It CANNOT perform model inference and is NOT a CPU fallback.
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
    "pytest-asyncio>=0.23.0,<2",
    "ruff>=0.16,<0.17",
    "mypy>=2.4,<2.5",
]
vllm = [
    "vllm==0.22.1",
    "nvidia-ml-py>=12.0.0",
]
# Aliases of the single `vllm` extra.
gpu = ["forgeai[vllm]"]
all = ["forgeai[vllm]"]

[project.scripts]
forgeai = "forgeai.cli.main:app"

[project.urls]
Homepage = "https://github.com/forgeai/forgeai"
Documentation = "https://github.com/forgeai/forgeai#readme"
Repository = "https://github.com/forgeai/forgeai"
Issues = "https://github.com/forgeai/forgeai/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
cache-dir = "/tmp/forgeai-ruff-cache"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = [
    "E501",
    # str+Enum -> StrEnum changes str()/format() output; keep the explicit mixin.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# typer.Option()/typer.Argument() and fastapi Depends() in defaults is the framework idiom.
"src/forgeai/cli/**/*.py" = ["B008"]
"src/forgeai/api/**/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
cache_dir = "/tmp/forgeai-pytest-cache"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
cache_dir = "/tmp/forgeai-mypy-cache"

[[tool.mypy.overrides]]
module = ["pynvml", "vllm", "vllm.*", "ray", "torch", "yaml"]
ignore_missing_imports = true
